<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7280;--bd:#e3e6ec;--ac:#0d9488;--acbg:#e6f6f4;--on:#16a34a;--onbg:#e8f7ee;--soon:#d97706;--soonbg:#fdf3e1;--end:#6b7280;--endbg:#eef0f3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--tx:#e8eaee;--mut:#98a1b0;--bd:#2d333d;--ac:#2dd4bf;--acbg:#16312e;--on:#4ade80;--onbg:#14301f;--soon:#fbbf24;--soonbg:#35290f;--endbg:#262b33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}

.tabs button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button.a{background:var(--ac);border-color:var(--ac);color:#fff}
.tabs b{font-weight:600;opacity:.8;margin-left:4px}
.ev{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:border-color .15s}
.ev:hover{border-color:var(--ac)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.s-on{background:var(--onbg);color:var(--on)}.s-soon{background:var(--soonbg);color:var(--soon)}.s-end{background:var(--endbg);color:var(--end)}
.ttl{font-weight:600;font-size:16px;flex:1}
.dt{color:var(--mut);font-size:13px}
.ds{margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tags span{font-size:12px;color:var(--mut);border:1px solid var(--bd);border-radius:999px;padding:1px 8px}
.info{display:grid;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}
.row{display:flex;gap:8px;align-items:flex-start;font-size:14px}.row .k{flex:0 0 74px;color:var(--mut)}.row .v{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.chips span{font-size:12px;background:var(--acbg);color:var(--ac);border-radius:6px;padding:1px 7px}
.fr{color:var(--soon);font-weight:600}.tk-free{color:var(--on);font-weight:600}.tk-pay{color:var(--soon);font-weight:600}
.opt{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:3px 10px;cursor:pointer;margin-bottom:14px}
.opt.a{background:var(--on);border-color:var(--on);color:#fff}
.foot{margin-top:28px;font-size:12px;color:var(--mut);text-align:center}
.cd{margin-top:6px;font-size:13px;font-weight:600}
.empty{color:var(--mut);text-align:center;padding:40px 0}
</style>

var onlyFree=false;
var TABS=[["all","全部"],["on","進行中"],["soon","尚未開始"],["end","已結束"]],cur="on";
var LBL={on:"進行中",soon:"尚未開始",end:"已結束"};
function ts(s){return new Date(s+":00+08:00").getTime()}
function fmt(s){var m=s.match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/),w="日一二三四五六"[new Date(Date.UTC(+m[1],m[2]-1,+m[3])).getUTCDay()];return m[1]+"/"+(+m[2])+"/"+(+m[3])+"（"+w+"）"+m[4]+":"+m[5]}
function days(ms){var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);return d>0?d+" 天 "+h+" 小時":h+" 小時"}
function render(){
  var now=Date.now();
  var L=EVENTS.map(function(e){var a=ts(e.start),b=ts(e.end);return Object.assign({a:a,b:b,st:now<a?"soon":now>b?"end":"on"},e)});
  var cnt={all:L.length,on:0,soon:0,end:0};L.forEach(function(e){cnt[e.st]++});
  var tb=document.getElementById("tabs");tb.innerHTML="";
  TABS.forEach(function(t){var b=document.createElement("button");b.className=cur===t[0]?"a":"";b.innerHTML=t[1]+"<b>"+cnt[t[0]]+"</b>";b.onclick=function(){cur=t[0];render()};tb.appendChild(b)});
  var v=L.filter(function(e){return (cur==="all"||e.st===cur)&&(!onlyFree||!e.pay)});
  var ord={on:0,soon:1,end:2};
  v.sort(function(x,y){return x.st!==y.st?ord[x.st]-ord[y.st]:x.st==="on"?x.b-y.b:x.st==="soon"?x.a-y.a:y.b-x.b});
  var ls=document.getElementById("list");ls.innerHTML="";
  if(!v.length){ls.innerHTML='<div class="empty">這個分類目前沒有活動</div>';return}
  v.forEach(function(e){
    var a=document.createElement("a");a.className="ev";a.href=e.url;
    var cd=e.st==="on"?"還剩 "+days(e.b-now):e.st==="soon"?days(e.a-now)+"後開始":"";
    a.innerHTML='<div class="top"><span class="ttl"></span><span class="badge s-'+e.st+'">'+LBL[e.st]+'</span></div><div class="dt"></div><div class="ds"></div>'+(e.tags?'<div class="tags"></div>':'')+(cd?'<div class="cd" style="color:var(--'+(e.st==="on"?"on":"soon")+')"></div>':"");
    a.querySelector(".ttl").textContent=e.title;
    a.querySelector(".dt").textContent=fmt(e.start)+" ～ "+fmt(e.end);
    a.querySelector(".ds").textContent=e.desc||"";
    var inf=document.createElement("div");inf.className="info";
    function row(k,vh){var r=document.createElement("div");r.className="row";r.innerHTML='<div class="k"></div><div class="v"></div>';r.querySelector(".k").textContent=k;r.querySelector(".v").innerHTML=vh;inf.appendChild(r);return r}
    function esc(x){return x.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
    var r1=row("🌱 金色花苗",'<b>'+esc(e.seed.n)+'</b><div class="chips"></div>');
    e.seed.items.forEach(function(t){var c=document.createElement("span");c.textContent=t;r1.querySelector(".chips").appendChild(c)});
    row("✉️ 明信片",esc(e.card));
    row("🔁 頻率",'<span class="fr">'+esc(e.freq)+'</span>'+(e.freqNote?'<div class="dt">'+esc(e.freqNote)+'</div>':''));
    row("🎫 票券",'<span class="'+(e.pay?"tk-pay":"tk-free")+'">'+esc(e.ticket)+'</span>');
    a.appendChild(inf);
    if(e.tags)e.tags.forEach(function(t){var x=document.createElement("span");x.textContent=t;a.querySelector(".tags").appendChild(x)});
    if(cd)a.querySelector(".cd").textContent=cd;
    ls.appendChild(a)
  })
}
document.getElementById("free").onclick=function(){onlyFree=!onlyFree;this.className="opt"+(onlyFree?" a":"");render()};
render();setInterval(render,60000);
</script>
